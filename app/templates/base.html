<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Motozintla de Mendoza{% endblock %}</title>
    <!-- ESTILOS LOCALES PROPIOS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="mountain" class="w-6 h-6 text-emerald-600"></i>
                <span class="font-bold text-xl tracking-tight text-slate-900">Motozintla</span>
            </div>
            <div class="hidden md:flex space-x-8 font-medium text-slate-600">
                <a href="/" class="hover:text-emerald-600 transition-colors">Inicio</a>
                <a href="{{ url_for('ardillas.index') }}" class="hover:text-emerald-600 transition-colors flex items-center gap-1">🐿️ Club Ardillas</a>
                <a href="/historia" class="hover:text-emerald-600 transition-colors">Historia</a>
                <a href="#" class="hover:text-emerald-600 transition-colors">Turismo</a>
                <a href="#" class="hover:text-emerald-600 transition-colors">Café de la Sierra</a>
            </div>
            <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition-all text-sm shadow-sm shadow-emerald-200">
                Explorar
            </button>
        </div>
    </nav>

    <!-- CONTENIDO DINÁMICO DE LAS PÁGINAS -->
    <div class="flex-grow">
        
	{% block content %}
        {% endblock %}
    </div>

  <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center space-x-2 text-white">
                <i data-lucide="mountain" class="w-5 h-5 text-emerald-500"></i>
                <span class="font-semibold text-lg">Motozintla Digital</span>
            </div>
            <p class="text-sm font-light">&copy; 2026 Portal de Motozintla. Creado de manera independiente.</p>
        </div>
    </footer>

    <!-- Cargar e inicializar Lucide Icons correctamente desde unpkg -->
    <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
